name: Update Bike Data with Prediction
on:
  schedule:
    - cron: '0 17 * * 1'
  workflow_dispatch:

concurrency:
  group: bike-share-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    container: rocker/tidyverse:4.4.2
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libxml2-dev \
            libcurl4-openssl-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/R/site-library
          key: r-packages-r4.4.2-${{ hashFiles('requirements-r.txt') }}
          restore-keys: |
            r-packages-r4.4.2-

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(readLines("requirements-r.txt"), repos = "https://cloud.r-project.org")'

      - name: Run R script
        run: Rscript update_report.R

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update bike share dashboard"
          title: "Update bike share dashboard"
          body: "Automated data update"
          branch: "auto/update-bike-${{ github.run_id }}"
          base: main
          delete-branch: true

      - name: Auto-Merge Pull Request
        if: steps.create-pr.outputs.pull-request-number != ''
        uses: actions/github-script@v6
        with:
          script: |
            const prNumber = Number(${{ steps.create-pr.outputs.pull-request-number }});
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let merged = false;
            for (let attempt = 0; attempt < 10 && !merged; attempt++) {
              try {
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                if (pr.mergeable === true &&
                    pr.mergeable_state !== 'dirty' &&
                    pr.mergeable_state !== 'blocked') {
                  const res = await github.rest.pulls.merge({
                    owner, repo, pull_number: prNumber, merge_method: 'squash'
                  });
                  merged = res.data.merged;
                  if (merged) break;
                }
              } catch (e) {
                console.log(`Attempt ${attempt + 1} to merge PR #${prNumber} failed: ${e.message}`);
              }
              await new Promise((r) => setTimeout(r, 10000));
            }
            if (!merged) {
              core.setFailed(`Could not auto-merge PR #${prNumber}`);
            }

  release:
    # Publish the merged dataset as a GitHub Release (one per snapshot date).
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Compute snapshot metadata
        id: snapshot
        run: |
          LAST=$(tail -1 data/consolidated_metrics.csv)
          SNAP_DATE=$(echo "$LAST" | cut -d, -f1 | tr -d '"' | cut -d' ' -f1)
          echo "snapshot_date=${SNAP_DATE}" >> "$GITHUB_OUTPUT"
          echo "last=${LAST}" >> "$GITHUB_OUTPUT"

      - name: Build dataset archive
        run: |
          cd data
          zip -r ../dataset-archive.zip . -x '*.DS_Store'
          cd ..

      - name: Create release notes
        run: |
          LAST="${{ steps.snapshot.outputs.last }}"
          SNAP_TIME=$(echo "$LAST" | cut -d, -f1 | tr -d '"')
          BIKES=$(echo "$LAST" | cut -d, -f2)
          DOCKS=$(echo "$LAST" | cut -d, -f3)
          UTIL=$(echo "$LAST" | cut -d, -f4 | awk '{printf "%.1f%%", $1}')
          ACTIVE=$(echo "$LAST" | cut -d, -f5)
          TOTAL=$(echo "$LAST" | cut -d, -f6)
          printf '%s\n' \
            "Snapshot: ${SNAP_TIME} (America/Toronto)" \
            "" \
            "| Metric | Value |" \
            "|---|---|" \
            "| Bikes available | ${BIKES} |" \
            "| Docks available | ${DOCKS} |" \
            "| Utilization | ${UTIL} |" \
            "| Active stations | ${ACTIVE}/${TOTAL} |" \
            "" \
            "Dashboard: https://bryanpaget.github.io/toronto-bikeshare/" \
            "" \
            "Assets:" \
            "- \`consolidated_metrics.csv\` - one row per snapshot (system-wide metrics history)" \
            "- \`consolidated_stations.csv\` - per-station snapshots (one row per station per capture)" \
            "- \`dataset-archive.zip\` - full data/ directory, including the per-snapshot archive CSVs" \
            > release-notes.md

      - name: Create or refresh release
        run: |
          set -euo pipefail
          TAG="dataset-${{ steps.snapshot.outputs.snapshot_date }}"
          RELEASE_TITLE="Bike Share Dataset ${{ steps.snapshot.outputs.snapshot_date }}"
          # Refresh any existing release for the same date (self-healing re-runs)
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" -m "$RELEASE_TITLE"
          git push origin "$TAG" --force
          gh release create "$TAG" \
            data/consolidated_metrics.csv \
            data/consolidated_stations.csv \
            dataset-archive.zip \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md
